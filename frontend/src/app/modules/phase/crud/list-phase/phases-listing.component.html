<div class="align">
  <button *ngIf="backButton" mat-button color="accent"  (click)="resetSubFilter()"  aria-label="New suubPhase ">Back to Phases</button>

  <button  *ngIf="isPM" mat-button color="accent"  (click)="createNew(c)"  aria-label="New Phase">New phase</button>

</div>

<div class="mat-elevation-z8">

  <table mat-table matSort [dataSource]="dataSource">
    <caption>{{title}}</caption>
    <!-- id Column -->

    <!-- Name Column -->v315
    <ng-container matColumnDef="name">
      <th mat-header-cell mat-sort-header *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>


     <!-- cost Column -->v315
    <ng-container matColumnDef="order">
      <th mat-header-cell mat-sort-header *matHeaderCellDef> order </th>
      <td mat-cell *matCellDef="let element"> {{element.posistion}} </td>
    </ng-container>

      <ng-container matColumnDef="progress">
      <th mat-header-cell mat-sort-header *matHeaderCellDef> progress </th>
      <td mat-cell *matCellDef="let element"   > {{element.progress}}  </td>

    </ng-container>

          <ng-container  class="mat-expansion button" matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button (click)="openDialogCaller(element,detail)" mat-button class="mat-button-black">details</button>
                </td>
    </ng-container>
       <ng-container class="mat-expansion button" matColumnDef="SubPhases">
      <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button (click)="filterSubPhase(element.id)" mat-button class="mat-button-black">SubPhases</button>
                </td>
    </ng-container>
       <ng-container class="mat-expansion button" matColumnDef="activities">
      <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button (click)="this.operations.goToSecondGen(element.id,'activity','Phase')" mat-button class="mat-button-black">Activities</button>
                </td>
    </ng-container>



        <!-- update Column -->v315
   <ng-container matColumnDef="update">
                <th mat-header-cell  *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="isPM" (click)="update(element.id,u)" mat-raised-button color="primary">Update</button>
                </td>
   </ng-container>


            <!-- delete Column -->v315
    <ng-container matColumnDef="delete">
                <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="isPM" (click)="delete(element.id,d)" mat-raised-button color="warn">Delete</button>
                </td>
    </ng-container>


     <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
