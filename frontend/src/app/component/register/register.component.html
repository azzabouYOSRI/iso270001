<mat-card>
    <mat-card-header>
        <h2>Registeration</h2>
    </mat-card-header>
    <mat-card-content>
        <form class="example-form" [formGroup]="registerform" (ngSubmit)="proceedregister()">
            <mat-form-field class="example-full-width">
              <mat-label>email</mat-label>
              <input matInput formControlName="email" >
            </mat-form-field>

            <mat-form-field class="example-full-width">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" >
              </mat-form-field>

              <mat-form-field class="example-full-width">
                <mat-label>Surname</mat-label>
                <input matInput formControlName="surname" >
              </mat-form-field>

          <mat-form-field class="example-full-width">
                <mat-label>Phone</mat-label>
                <input matInput formControlName="phone" >
              </mat-form-field>

              <mat-form-field class="example-full-width">
                <mat-label>Password</mat-label>
                <input type="password" matInput formControlName="password" >
              </mat-form-field>

              <mat-form-field class="example-full-width">
                <mat-label>address</mat-label>
                <input matInput formControlName="adress" >
              </mat-form-field>

          <mat-form-field class="example-full-width">
              <mat-select formControlName="typeOfUser">
                <mat-label>Type of User</mat-label>
                <mat-option *ngFor="let user of typeOfUser" [value]="user" > {{user}}</mat-option>
              </mat-select>
          </mat-form-field>

              <mat-radio-group formControlName="gender" aria-label="Select an option">
                <mat-radio-button value="male">Male</mat-radio-button>
                <mat-radio-button value="female">Female</mat-radio-button>
              </mat-radio-group>

              <div>
                <button mat-raised-button color="primary">Submit</button>
                <a routerLink="/login" mat-raised-button color="accent">Back to Login</a>
              </div>

          </form>
    </mat-card-content>
  </mat-card>
