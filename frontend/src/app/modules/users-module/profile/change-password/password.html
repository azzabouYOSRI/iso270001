<mat-card>
    <mat-card-header class="align">
        <h2>Password update </h2>
    </mat-card-header>
    <mat-card-content>
        <form class="example-form" [formGroup]="Form" (ngSubmit)="proceedSave()">

            <div class="align">
            <mat-form-field  class="full-width">
                <mat-label>old password</mat-label>
                <input matInput formControlName="oldPassword" >
              </mat-form-field>
          </div>
          <div class="align">
             <mat-form-field  class="full-width">
                <mat-label>new password </mat-label>
                <input matInput formControlName="newPassword" >
              </mat-form-field>
          </div>
          <div class="align">
            <mat-form-field  class="full-width">
                <mat-label>comfirm password</mat-label>
                <input matInput formControlName="confirmPassword" >
              </mat-form-field>
          </div>
          <div class="align">
                <button mat-raised-button color="primary">Submit</button></div>
          </form>
    </mat-card-content>
  </mat-card>
