<mat-card class="content">
    <mat-card-header>
        <h2>{{title}}</h2>
    </mat-card-header>
    <mat-card-content>
        <form class="example-form" [formGroup]="memberForm" (ngSubmit)="proceedAdd()">

          <mat-form-field class="example-full-width">
            <mat-label>user </mat-label>
              <mat-select (selectionChange)="onOptionSelected($event)" formControlName="type">
                <mat-option *ngFor="let name of names" [value]="name" > {{name}}</mat-option>
              </mat-select>
          </mat-form-field>

              <div>
                <button mat-raised-button color="primary">Submit</button></div>
          </form>
    </mat-card-content>
  </mat-card>
