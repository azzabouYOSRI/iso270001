<div class="align">
  <button mat-button color="accent" (click)="this.operations.goTo('activity')" aria-label=" ">Back to activities</button>

  <button mat-button color="accent" *ngIf="isPM"  (click)="this.operations.goTo('new-task')"  aria-label="New task">New task</button>

</div>

<div class="mat-elevation-z8">

  <table mat-table matSort [dataSource]="dataSource">
    <caption>{{title}}</caption>
    <!-- id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell mat-sort-header *matHeaderCellDef> id </th>
      <td mat-cell *matCellDef="let element"   > {{element.id}}  </td>

    </ng-container>

    <!-- Name Column -->v315
    <ng-container matColumnDef="name">
      <th mat-header-cell mat-sort-header *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>


     <!-- cost Column -->v315
    <ng-container matColumnDef="order">
      <th mat-header-cell mat-sort-header *matHeaderCellDef> order </th>
      <td mat-cell *matCellDef="let element"> {{element.posistion}} </td>
    </ng-container>

          <ng-container class="mat-expansion" matColumnDef="details">
      <<th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button (click)="openDialogCaller(element,Taskdetail)" mat-button class="mat-button-black">details</button>
                </td>
    </ng-container>
    <!-- update Column -->v315
   <ng-container matColumnDef="validate">
                <th mat-header-cell  *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="element.progress == 100 && isPM" (click)="validate(element)" mat-raised-button color="accent">validate</button>
                </td>
   </ng-container>
    <ng-container matColumnDef="reject">
                <th mat-header-cell  *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="element.progress == 100 && isPM" (click)="reject(element)" mat-raised-button class="warn" >reject</button>
                </td>
   </ng-container>

        <!-- update Column -->v315
   <ng-container matColumnDef="update">
                <th mat-header-cell  *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="isPM" (click)="this.operations.goToSecondGen(element.id,'update-task','Task')" mat-raised-button color="primary">Update</button>
                </td>
   </ng-container>


            <!-- delete Column -->v315
    <ng-container matColumnDef="delete">
                <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="isPM" (click)="delete(element.id,d)" mat-raised-button color="warn">Delete</button>
                </td>
    </ng-container>


     <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
