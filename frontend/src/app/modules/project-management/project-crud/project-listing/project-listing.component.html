<div class="mat-elevation-z8">
  <table mat-table matSort [dataSource]="dataSource">
    <caption>All projects</caption>
    <!-- id Column -->
    <ng-container matColumnDef="idp">
      <th mat-header-cell mat-sort-header *matHeaderCellDef> id </th>
      <td mat-cell *matCellDef="let element"   > {{element.idp}}  </td>

    </ng-container>

    <!-- Name Column -->v315
    <ng-container matColumnDef="name">
      <th mat-header-cell mat-sort-header *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

     <!-- details Column -->v315
         <ng-container class="mat-expansion" matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button (click)="openDialogCaller(element,ProjectDetailsComponent)" mat-button class="mat-button-black">details</button>
                </td>
    </ng-container>



        <!-- Active project Column -->v315
    <ng-container matColumnDef="activeProject" >
      <th  mat-header-cell mat-sort-header  *matHeaderCellDef> Active project </th>
      <td  mat-cell *matCellDef="let element"> {{element.activeProject? 'true': 'false'}} </td>
    </ng-container>



              <!-- project members Column -->v315
    <ng-container matColumnDef="projectMembers">
                <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button (click)="operations.goToSecondGen(element.idp,'members','Project')" mat-button class="mat-button-black">members</button>
                </td>
    </ng-container>

              <!-- allPhases Column -->v315
    <ng-container matColumnDef="phases">
                <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button (click)="operations.goToSecondGen(element.idp,'phases','Project');" mat-button class="mat-button-black">Phases</button>
                </td>
    </ng-container>

         <!-- dependencies Column -->v315
    <ng-container matColumnDef="projectDep">
                <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button (click)="operations.goToSecondGen(element.idp,'project-deps','Project')" mat-button class="mat-button-black"> dependencies</button>
                </td>
      </ng-container>
              <!-- update Column -->v315
   <ng-container matColumnDef="update">
                <th mat-header-cell  *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="element.isPm" (click)="update(element.idp,u)" mat-raised-button color="primary">Update</button>
                </td>
   </ng-container>

            <!-- delete Column -->v315
    <ng-container  matColumnDef="delete">
                <th mat-header-cell *matHeaderCellDef>  </th>
                <td mat-cell *matCellDef="let element">
                    <button *ngIf="isAdmin" (click)="delete(element.idp,d)" mat-raised-button color="warn">Delete</button>
                </td>
    </ng-container>
     <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
